# Quick run without PostgreSQL:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Data lives in memory and is reset every time the server stops.
spring.datasource.url=jdbc:h2:mem:cosmic;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
