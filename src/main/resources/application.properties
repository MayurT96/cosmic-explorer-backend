spring.application.name=cosmic-explorer-backend
server.port=${PORT:8080}

# ---- PostgreSQL (default). Change with environment variables, no code edits needed. ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cosmic_explorer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- CORS: the React dev server ----
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# ---- JWT: use your own long random secret (at least 32 characters) outside development ----
app.jwt.secret=${JWT_SECRET:development-only-secret-change-me-before-deploying-1234567890}
app.jwt.expiry-hours=24

# ---- AI assistant (Google Gemini). Leave the key empty to disable the assistant. ----
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# ---- NASA (DEMO_KEY works with low rate limits; get a free key at api.nasa.gov) ----
app.nasa.api-key=${NASA_API_KEY:DEMO_KEY}

# ---- API docs: open /swagger-ui.html ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
